    <script>
      // Suppress Vite HMR WebSocket connection errors in sandbox iframe where HMR is disabled
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.includes('WebSocket') || e.message.includes('websocket') || e.message.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(e) {
        var msg = e.reason && (e.reason.message || String(e.reason));
        if (msg && (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('@vite/client'))) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      });
    </script>
